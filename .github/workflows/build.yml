# ---------------------------------------------------------------------------
# Rebuilds the site whenever anything changes.
#
# Drop a PDF into documents/ or edit a file in content/, and this runs
# tools/build.py and commits the regenerated pages. Nobody has to run
# anything by hand.
# ---------------------------------------------------------------------------
name: Rebuild the site

on:
  push:
    branches: [main]
    paths:
      - 'documents/**'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Rebuild
        run: python3 tools/build.py

      - name: Commit the rebuilt pages
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive-data.js whispers.html minutes.html events.html index.html
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
